<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="44" font-size="28" font-weight="bold" fill="#0f172a">Every field right, on two development sets</text><text x="40" y="74" font-size="16" font-weight="normal" fill="#334155">Both sets are development data. The rules parser was written after reading them, and it also gets every field right.</text><text x="40" y="118" font-size="19" font-weight="bold" fill="#0f172a">25 development lines, two runs</text><text x="40" y="150" font-size="17" font-weight="normal" fill="#0f172a">gpt-oss:20b</text><text x="40" y="180" font-size="14" font-weight="normal" fill="#334155">first</text><rect x="100" y="165" width="300" height="20" rx="4" fill="#e2e8f0"/><rect x="100" y="165" width="300" height="20" rx="4" fill="#94a3b8"/><text x="412" y="180" font-size="14" font-weight="normal" fill="#334155">25/25, 25/25</text><text x="40" y="212" font-size="14" font-weight="normal" fill="#334155">split</text><rect x="100" y="197" width="300" height="20" rx="4" fill="#e2e8f0"/><rect x="100" y="197" width="288" height="20" rx="4" fill="#4f46e5"/><text x="412" y="212" font-size="14" font-weight="normal" fill="#334155">24/25, 24/25</text><text x="40" y="270" font-size="17" font-weight="normal" fill="#0f172a">gemma4:31b</text><text x="40" y="300" font-size="14" font-weight="normal" fill="#334155">first</text><rect x="100" y="285" width="300" height="20" rx="4" fill="#e2e8f0"/><rect x="100" y="285" width="300" height="20" rx="4" fill="#94a3b8"/><text x="412" y="300" font-size="14" font-weight="normal" fill="#334155">25/25, 25/25</text><text x="40" y="332" font-size="14" font-weight="normal" fill="#334155">split</text><rect x="100" y="317" width="300" height="20" rx="4" fill="#e2e8f0"/><rect x="100" y="317" width="300" height="20" rx="4" fill="#4f46e5"/><text x="412" y="332" font-size="14" font-weight="normal" fill="#3