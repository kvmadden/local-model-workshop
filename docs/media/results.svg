one target.</text><text x="40" y="678" font-size="15" font-weight="normal" fill="#334155">All 10 model misses are the frequency of an as-needed line with a schedule or a bedtime anchor. No drug or dose was wrong.</text><text x="40" y="706" font-size="15" font-weight="normal" fill="#334155">The pick changes with the rule for "at bedtime as needed". See docs/DEVELOPMENT-RESULTS.md.</text><text x="40" y="734" font-size="15" font-weight="normal" fill="#334155">Synthetic lines only. Latency was measured on a heavily loaded shared Mac and is not shown.</text></g></svg>