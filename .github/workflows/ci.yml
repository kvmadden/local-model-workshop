name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests, including evidence re-scoring
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Offline audit reproduction
        run: npm run audit:score
      - name: Baselines run end to end with no model
        run: npm run eval:baselines -- --out "$RUNNER_TEMP/baselines"
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (hermetic, no Ollama)
        run: npm run test:e2e -- --workers=2
      - name: Keep the browser report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
